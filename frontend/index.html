<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B8F3C" />
    <meta name="description" content="Fresh groceries, delivered fast. Shop fruits, vegetables, dairy, snacks, and everyday essentials at everyday low prices." />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="/" />

    <!-- Open Graph (overridden per-page by the SEO component once React mounts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FreshMart" />
    <meta property="og:title" content="FreshMart — Fresh groceries, delivered fast" />
    <meta property="og:description" content="Fresh groceries, delivered fast. Shop fruits, vegetables, dairy, snacks, and everyday essentials at everyday low prices." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FreshMart — Fresh groceries, delivered fast" />
    <meta name="twitter:description" content="Fresh groceries, delivered fast. Shop fruits, vegetables, dairy, snacks, and everyday essentials at everyday low prices." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet" />
    <title>FreshMart — Fresh groceries, delivered</title>
    <style>
      /* Shown instantly on first paint, before the JS bundle loads/executes.
         main.jsx removes #initial-loader once React has mounted into #root. */
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #F8FAF8;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #initial-loader .spinner {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 4px solid rgba(11, 143, 60, 0.15);
        border-top-color: #0B8F3C;
        animation: initial-loader-spin 0.9s linear infinite;
      }
      #initial-loader .brand {
        font-weight: 700;
        font-size: 18px;
        color: #0B8F3C;
      }
      #initial-loader.fade-out {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        #initial-loader { background: #0a0a0a; }
      }
    </style>
  </head>
  <body class="bg-bg dark:bg-gray-950">
    <div id="initial-loader" role="status" aria-live="polite" aria-label="Loading FreshMart">
      <div class="spinner" aria-hidden="true"></div>
      <div class="brand">FreshMart</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
