version: "3.9"

# SQLite only — no db/postgres service. The sqlite file lives on the sqlite_data
# volume so it survives container restarts and is shared by backend/celery containers.
# Nothing here forces HTTPS: nginx listens on plain :80 (deploy/nginx/default.conf) and
# only terminates TLS if you add that configuration yourself in front of this stack.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Absolute path wins over BASE_DIR in settings.py's `BASE_DIR / config("DB_NAME")`,
      # so this places the sqlite file on the sqlite_data volume instead of inside the
      # (ephemeral) container filesystem.
      DB_NAME: /app/db/db.sqlite3
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - sqlite_data:/app/db
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    expose:
      - "8000"

  celery_worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_NAME: /app/db/db.sqlite3
    depends_on:
      - backend
    volumes:
      - sqlite_data:/app/db
    command: celery -A config worker --loglevel=info

  celery_beat:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DB_NAME: /app/db/db.sqlite3
    depends_on:
      - backend
    volumes:
      - sqlite_data:/app/db
    command: celery -A config beat --loglevel=info

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static
      - media_data:/media
    depends_on:
      - backend
      - frontend

volumes:
  media_data:
  static_data:
  sqlite_data:
